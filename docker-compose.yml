# Everything on your own computer, including MongoDB:
#   docker compose up --build
#   docker compose exec app node backend/scripts/seed.js
# then open http://localhost:5000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/rootbridge
      CLIENT_ORIGIN: http://localhost:5000
      # Fine on your own computer only. Use a long random value anywhere real.
      JWT_SECRET: local-docker-only-secret-replace-me-0123456789abcdef
      GEMINI_API_KEY: ""
volumes:
  mongo-data:
