# Runs on every push: backend tests against a real MongoDB, and a
# frontend lint + production build.
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npm run test:ci # fails (does not skip) if MongoDB is missing
        working-directory: backend
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/rootbridge_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx --yes oxlint@latest src -D correctness --react-plugin -A react/react-in-jsx-scope
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
